name: Feature request / Предложить улучшение
description: Suggest a change to ScreenOff. Можно писать по-русски.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case / Задача или сценарий
      description: What would you like to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior / Предлагаемое поведение
    validations:
      required: true
